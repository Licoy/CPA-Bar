name: Release

# Pushing a tag vX.Y.Z (./bump.sh -v X.Y.Z -p) runs the unit tests, then builds
# every platform on a native runner, verifies the installers and signed update
# files, writes release notes and checksums, then publishes the release.
#
# Secrets (Settings > Secrets and variables > Actions):
#   MYGO_UPDATER_PRIVATE_KEY           contents of mygo-update.key (signs updates)
#   MACOS_CERTIFICATE                  base64 of the self-signed macOS identity (.p12)
#   MACOS_CERTIFICATE_PASSWORD         password of that .p12
#   WINDOWS_CERTIFICATE                base64 of the self-signed Windows code signing .pfx
#   MYGO_WINDOWS_CERTIFICATE_PASSWORD  password of that .pfx

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release and its assets

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # The mygo CLI that builds, signs and uploads. go.mod does not pin it as a
  # `tool`, so CI runs it by version; keep this equal to the mygo version in go.mod.
  MYGO_CLI: github.com/egoist/mygo/cmd/mygo@v0.4.1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...

  prepare:
    name: Check and create the draft release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag, version and update key
        id: check
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MYGO_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in mygo.json (expected v$version)."
            exit 1
          fi
          key="$(jq -r '.updates.publicKey // ""' mygo.json)"
          if [ -z "$key" ] || [ "$key" = "REPLACE_WITH_MYGO_UPDATE_PUB" ]; then
            echo "::error::updates.publicKey in mygo.json is still the placeholder. Put the contents of mygo-update.pub there."
            exit 1
          fi
          for name in MYGO_UPDATER_PRIVATE_KEY MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD WINDOWS_CERTIFICATE MYGO_WINDOWS_CERTIFICATE_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository secret $name is not set."
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Select the release commit range
        id: range
        run: |
          set -euo pipefail
          range="$(scripts/release-notes-range.sh "$GITHUB_REF_NAME")"
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --strip header --output release-notes.md ${{ steps.range.outputs.range }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check release notes
        run: grep -q '[^[:space:]]' release-notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft > release.json 2> release-error.log; then
            if [ "$(jq -r .isDraft release.json)" != "true" ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published. Fix forward with a higher version instead of re-running."
              exit 1
            fi
            echo "Draft $GITHUB_REF_NAME exists; builds will replace its files."
          elif grep -Eqi '(^release not found$|HTTP 404: Not Found)' release-error.log; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "CPA-Bar $VERSION" --notes-file release-notes.md
          else
            cat release-error.log >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install NSIS and osslsigncode (Windows installers and signing)
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis osslsigncode

      - name: Write the Windows code signing certificate
        if: matrix.name == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          set -euo pipefail
          test -n "$WINDOWS_CERTIFICATE" || { echo "::error::Secret WINDOWS_CERTIFICATE is empty."; exit 1; }
          # The path mygo.json names in windows.certificate; certs/ is gitignored.
          mkdir -p certs
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > certs/cpabar-codesign.pfx

      - name: Import the self-signed macOS identity into a temporary keychain
        if: matrix.name == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MACOS_CERTIFICATE" || { echo "::error::Secret MACOS_CERTIFICATE is empty."; exit 1; }
          identity="$(jq -r .macos.signingIdentity mygo.json)"
          keychain="$RUNNER_TEMP/cpabar-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cpabar.p12"
          security import "$RUNNER_TEMP/cpabar.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cpabar.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          # A self-signed identity is only usable for code signing once trusted.
          security find-certificate -c "$identity" -p "$keychain" > "$RUNNER_TEMP/cpabar-cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$RUNNER_TEMP/cpabar-cert.pem"
          # Fail now, not in the middle of the build, if the identity cannot sign.
          cp /usr/bin/true "$RUNNER_TEMP/sign-probe"
          codesign --force --sign "$identity" --keychain "$keychain" "$RUNNER_TEMP/sign-probe"
          codesign --verify --verbose "$RUNNER_TEMP/sign-probe"
          rm -f "$RUNNER_TEMP/sign-probe" "$RUNNER_TEMP/cpabar-cert.pem"

      - name: Build, sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MYGO_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "::error::Secret MYGO_UPDATER_PRIVATE_KEY is empty."; exit 1; }
          go run "$MYGO_CLI" build -platform "${{ matrix.platform }}" -upload

      - name: Remove the self-signed DMG wrapper and replace the draft installers
        if: matrix.name == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # mygo signs both the app and its DMG with the same identity. A
          # self-signed DMG adds a Gatekeeper rejection before installation;
          # only Developer ID identities should sign disk images (Apple TN2206).
          # Keep the app and update signatures intact. First app launch still
          # needs approval until we use Developer ID signing and notarization.
          if [ "$(jq -r .macos.signingIdentity mygo.json)" = "CPA-Bar Self-Signed" ]; then
            out="$(jq -r .out mygo.json)"
            name="$(jq -r .name mygo.json)"
            version="$(jq -r .version mygo.json)"
            images=()
            for arch in arm64 amd64; do
              dmg="$out/darwin-$arch/$name $version $arch.dmg"
              codesign --verify --strict --verbose "$dmg"
              # codesign --remove-signature does not support disk images.
              # Re-encode the container; its filesystem and app stay intact.
              unsigned="${dmg%.dmg}.unsigned.dmg"
              hdiutil convert "$dmg" -format ULMO -ov -o "$unsigned"
              hdiutil verify "$unsigned"
              if signature="$(LC_ALL=C codesign --display "$unsigned" 2>&1)"; then
                echo "::error::Rebuilt DMG unexpectedly still has a signature."
                exit 1
              fi
              case "$signature" in
                *"code object is not signed at all") ;;
                *) echo "$signature" >&2; exit 1 ;;
              esac
              mv "$unsigned" "$dmg"
              images+=("$dmg")
            done
            gh release upload "$GITHUB_REF_NAME" "${images[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Remove the signing keychain and certificates
        if: always()
        run: |
          rm -f certs/cpabar-codesign.pfx
          if [ "$RUNNER_OS" = "macOS" ]; then
            security delete-keychain "$RUNNER_TEMP/cpabar-signing.keychain-db" || true
          fi

  verify:
    name: Verify the draft and write SHA256SUMS
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Check that every platform asset and update manifest is on the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          norm() { tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g'; }

          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release.json
          test "$(jq -r .isDraft release.json)" = "true" || { echo "::error::$GITHUB_REF_NAME is not a draft."; exit 1; }
          # Asset names GitHub stored (spaces become dots), normalized for matching.
          jq -r '.assets[] | select(.state == "uploaded") | .name' release.json | while IFS= read -r n; do
            printf '%s\t%s\n' "$(printf '%s' "$n" | norm)" "$n"
          done > assets.tsv
          cut -f1 assets.tsv > assets.norm

          # Draft assets are not public: download them through the API with the workflow token.
          fetch() { # fetch <asset name> <path>
            local api
            api="$(jq -r --arg n "$1" '.assets[] | select(.name == $n) | .apiUrl' release.json)"
            test -n "$api" || { echo "::error::Asset $1 is not on the draft."; return 1; }
            gh api -H "Accept: application/octet-stream" "$api" > "$2"
          }

          fail=0
          need() { # need <description> <ERE on normalized names>
            if ! grep -Eq "$2" assets.norm; then
              echo "::error::Missing on the draft: $1"
              fail=1
            fi
          }
          for t in darwin-arm64 darwin-amd64 windows-amd64 windows-arm64 linux-amd64 linux-arm64; do
            need "update-$t.json" "^update-$t-json\$"
            need "update archive for $t" "(^|-)$t-tar-gz\$"
          done
          need "macOS arm64 disk image" "arm64-dmg\$"
          need "macOS amd64 disk image" "amd64-dmg\$"
          need "Windows amd64 installer" "setup.*amd64-exe\$"
          need "Windows arm64 installer" "setup.*arm64-exe\$"
          need "Linux amd64 .deb" "amd64-deb\$"
          need "Linux arm64 .deb" "arm64-deb\$"
          need "install.sh" "^install-sh\$"
          # Every installer must carry the version being released.
          nv="$(printf '%s' "$VERSION" | norm)"
          for pat in "-dmg\$" "setup.*-exe\$" "-deb\$"; do
            for n in $(grep -E -- "$pat" assets.norm); do
              case "$n" in *-"$nv"-*) ;; *) echo "::error::$n does not carry version $VERSION"; fail=1 ;; esac
            done
          done
          [ "$fail" = 0 ] || exit 1

          # Each manifest must name this version, carry a signature, and point at an archive that is on the draft.
          for t in darwin-arm64 darwin-amd64 windows-amd64 windows-arm64 linux-amd64 linux-arm64; do
            mkdir -p manifests
            m="manifests/update-$t.json"
            fetch "update-$t.json" "$m"
            test "$(jq -r .version "$m")" = "$VERSION" || { echo "::error::update-$t.json is not version $VERSION"; fail=1; }
            test -n "$(jq -r '.signature // ""' "$m")" || { echo "::error::update-$t.json has no signature"; fail=1; }
            url="$(jq -r .url "$m")"
            base="$(basename "${url%%\?*}" | python3 -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))' | norm)"
            if ! grep -Fxq "$base" assets.norm; then
              echo "::error::update-$t.json points at $url, which is not an asset of the draft"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "All platform assets and manifests are on the draft."

      - name: Check that the update archives hold only the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # mygo ships every file of resources/ with every package, next to the
          # executable or in Contents/Resources. The installers pack the same
          # files as these archives, so nothing beyond the app may be in them.
          norm() { tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g'; }
          fetch() { # fetch <asset name> <path>
            local api
            api="$(jq -r --arg n "$1" '.assets[] | select(.name == $n) | .apiUrl' release.json)"
            gh api -H "Accept: application/octet-stream" "$api" > "$2"
          }

          fail=0
          for t in darwin-arm64 darwin-amd64 windows-amd64 windows-arm64 linux-amd64 linux-arm64; do
            url="$(jq -r .url "manifests/update-$t.json")"
            base="$(basename "${url%%\?*}" | python3 -c 'import sys, urllib.parse; print(urllib.parse.unquote(sys.stdin.read().strip()))' | norm)"
            name="$(awk -F'\t' -v b="$base" '$1 == b { print $2 }' assets.tsv)"
            fetch "$name" "archive-$t.tar.gz"
            tar -tzf "archive-$t.tar.gz" | sed -E 's#^\./##; s#/+$##' | grep -v '^$' > "archive-$t.txt"
            case "$t" in
              darwin-*) want="CPA-Bar.app" ;;
              windows-*) want="CPA-Bar.exe" ;;
              linux-*) want=$'cpa-bar\ncpa-bar.desktop\ncpa-bar.png' ;;
            esac
            got="$(cut -d/ -f1 "archive-$t.txt" | sort -u)"
            if [ "$got" != "$(printf '%s\n' "$want" | sort)" ]; then
              echo "::error::$name holds: $(echo $got); expected only: $(echo $want)"
              fail=1
            fi
            if extra="$(grep -E '^CPA-Bar\.app/Contents/Resources/.' "archive-$t.txt" | grep -vFx 'CPA-Bar.app/Contents/Resources/AppIcon.icns')"; then
              echo "::error::$name has files in Contents/Resources besides AppIcon.icns: $(echo $extra)"
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
          echo "Every update archive holds only the app."

      - name: Add release notes to update manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -q '[^[:space:]]' release-notes.md
          # Notes are manifest metadata; the signatures cover the archives.
          for m in manifests/update-*.json; do
            jq --rawfile notes release-notes.md '.notes = $notes' "$m" > "$m.tmp"
            mv "$m.tmp" "$m"
          done
          gh release upload "$GITHUB_REF_NAME" manifests/update-*.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Write SHA256SUMS and upload it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets > release.json
          mkdir -p dl
          jq -r '.assets[] | select(.name != "SHA256SUMS") | [.name, .apiUrl] | @tsv' release.json |
            while IFS=$'\t' read -r name api; do
              gh api -H "Accept: application/octet-stream" "$api" > "dl/$name"
            done
          for t in darwin-arm64 darwin-amd64 windows-amd64 windows-arm64 linux-amd64 linux-arm64; do
            jq -e --rawfile notes release-notes.md '.notes == $notes' "dl/update-$t.json" > /dev/null || {
              echo "::error::update-$t.json release notes do not match the release body."
              exit 1
            }
          done
          # Everything on the draft except SHA256SUMS itself, so a re-run replaces it cleanly.
          (cd dl && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release.json
          test "$(jq -r .isDraft release.json)" = "true" || { echo "::error::$GITHUB_REF_NAME is not a draft."; exit 1; }
          test "$(jq -r '[.assets[] | select(.name == "SHA256SUMS" and .state == "uploaded")] | length' release.json)" = "1" || {
            echo "::error::SHA256SUMS was not uploaded successfully."
            exit 1
          }
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md --draft=false
          {
            echo "### Published $GITHUB_REF_NAME"
            echo
            echo "Every platform asset and update manifest was verified, and SHA256SUMS was added."
          } >> "$GITHUB_STEP_SUMMARY"
